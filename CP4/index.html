<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP4 - Grid e Responsividade</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main>
        <section class="inicial">
            <div class="container-inicial">
                <img class="hero" src="./images/banner/01.jpg" alt="Cidade próxima ao mar">
                <div class="texto">
                    <p>
                        Conheça lugares incríveis, belas paisagens
                        e destinos perfeitos para aproveitar suas férias.
                    </p>
                    <div id="#glr">
                        <button>Saiba mais</button>
                    </div>
                </div>
                <div class="galeria-pequena">
                    <img src="./images/banner/02.jpg" alt="Varanda com vista para o mar">
                    <img src="./images/banner/03.jpg" alt="Igreja branca próxima ao mar">
                    <img src="./images/banner/04.jpg" alt="Casa com flores vermelhas">
                </div>
            </div>
        </section>
        <section class="galeria-secao" id="glr">
            <div class="galeria">
                <img src="./images/sea/01.jpg" alt="Praia com pedras">
                <img src="./images/sea/02.jpg" alt="Praia com mar azul">
                <img src="./images/sea/03.jpg" alt="Paisagem próxima ao mar">
                <img src="./images/sea/01.jpg" alt="Praia com pedras">
                <img src="./images/sea/02.jpg" alt="Praia com mar azul">
                <img src="./images/sea/03.jpg" alt="Paisagem próxima ao mar">
                <img src="./images/sea/01.jpg" alt="Praia com pedras">
                <img src="./images/sea/02.jpg" alt="Praia com mar azul">
            </div>
        </section>
    </main>
